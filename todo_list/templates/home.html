{% extends 'base.html' %}

{% block content %}

  {% if all_items %}
    <table class="table table-bordered">
      {% for things in all_items %}
        {% if things.completed %}
          <tr class="table-secondary">
            <td class="striker"><s>{{ things.item }}</s></td>
            <td><center><a href="{% url 'unstrike' things.id %}">Uncross</a></center></td>
            <td><center><a href="{% url 'delete' things.id %}">Delete</a></center></td>
          </tr>
        {% else %}
          <tr>
            <td>{{ things.item }}</td>
            <td><center><a href="{% url 'strike' things.id %}">Cross Off</a></center></td>
            <td><center><a href="{% url 'delete' things.id %}">Delete</a></center></td>
          </tr>
        {% endif %}
      {% endfor %}
    </table>
  {% endif %}

{% endblock %}
